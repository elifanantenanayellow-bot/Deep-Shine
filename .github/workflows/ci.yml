name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepshine_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-only-secret-value-thirty-two-characters-min
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deepshine_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm v10 blocks postinstall scripts, so the Prisma client is not
      # generated by install; typecheck needs its generated types.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Prepare foundation test database
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      # The single-file offline demo must keep building — it is the artifact
      # handed to customers when hosting isn't available.
      - name: Build standalone HTML demo
        run: pnpm run build:standalone

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (demo + foundation)
        run: pnpm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Proves the production deploy path: committed migration history applied to
  # a virgin Postgres, then seeded, then sanity-checked. This is exactly what
  # `migrate deploy` will do against the real database.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepshine_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deepshine_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migration history to virgin database
        run: pnpm exec prisma migrate deploy

      - name: Generate client and seed
        run: |
          pnpm exec prisma generate
          pnpm exec tsx prisma/seed.ts

      - name: Sanity-check seeded data
        run: |
          pnpm exec tsx -e "
          import { PrismaClient } from '@prisma/client';
          const p = new PrismaClient();
          (async () => {
            const orgs = await p.organization.count();
            const users = await p.user.count();
            const appts = await p.appointment.count();
            if (orgs < 2 || users < 3 || appts < 1) {
              throw new Error('Seed sanity check failed: orgs=' + orgs + ' users=' + users + ' appts=' + appts);
            }
            console.log('Seed OK: orgs=' + orgs + ' users=' + users + ' appts=' + appts);
            await p.\$disconnect();
          })();
          "
